<!DOCTYPE html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}SmartCloud — O'quvchilar{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      * { font-family: 'Inter', sans-serif; }
      body { background: #f0f4f8; min-height: 100vh; }

      .top-navbar {
        background: linear-gradient(135deg, #1a1f36 0%, #2d3561 100%);
        padding: 0 2rem;
        height: 60px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        position: sticky;
        top: 0;
        z-index: 100;
        box-shadow: 0 2px 12px rgba(0,0,0,0.3);
      }
      .brand {
        color: white;
        font-weight: 700;
        font-size: 1.1rem;
        text-decoration: none;
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .brand-icon {
        width: 32px; height: 32px;
        background: linear-gradient(135deg, #667eea, #764ba2);
        border-radius: 8px;
        display: flex; align-items: center; justify-content: center;
        font-size: 16px;
      }
      .main-content { padding: 2rem; max-width: 1100px; margin: 0 auto; }

      .btn-primary {
        background: linear-gradient(135deg, #667eea, #764ba2);
        border: none;
        font-weight: 500;
      }
      .btn-primary:hover {
        background: linear-gradient(135deg, #5a6fd6, #6a3f9e);
        transform: translateY(-1px);
        box-shadow: 0 4px 12px rgba(102,126,234,0.4);
      }
      .card {
        border: none;
        border-radius: 16px;
        box-shadow: 0 2px 12px rgba(0,0,0,0.06);
      }
      .table thead th {
        background: #f8fafc;
        font-size: 0.75rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        color: #6b7280;
        border-bottom: 2px solid #e5e7eb;
        padding: 14px 16px;
      }
      .table tbody td {
        padding: 14px 16px;
        vertical-align: middle;
        border-bottom: 1px solid #f3f4f6;
      }
      .table tbody tr:last-child td { border-bottom: none; }
      .table tbody tr:hover { background: #f9fafb; }

      .stat-card {
        border-radius: 16px;
        padding: 1.25rem 1.5rem;
        color: white;
        border: none;
      }
      .stat-card.total { background: linear-gradient(135deg, #667eea, #764ba2); }
      .stat-card.synced { background: linear-gradient(135deg, #11998e, #38ef7d); color: #fff; }
      .stat-card.pending { background: linear-gradient(135deg, #f7971e, #ffd200); color: #333; }

      .alert { border-radius: 12px; border: none; }
    </style>
    {% block extra_css %}{% endblock %}
  </head>
  <body>

    <nav class="top-navbar">
      <a href="{% url 'student_list' %}" class="brand">
        <div class="brand-icon">🎓</div>
        SmartCloud
      </a>
      <a href="{% url 'student_create' %}" class="btn btn-primary btn-sm px-3">
        <i class="fa fa-plus me-1"></i> Yangi o'quvchi
      </a>
    </nav>

    <div class="main-content">
      {% if messages %}
        {% for message in messages %}
          <div class="alert alert-{{ message.tags }} alert-dismissible fade show mb-3" role="alert">
            {{ message }}
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
          </div>
        {% endfor %}
      {% endif %}

      {% block content %}{% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    {% block extra_js %}{% endblock %}
  </body>
</html>
